<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			#contents {
				padding: 5px;
				border: 1px green solid;
			}
		</style>
	</head>

	<body>
		<fieldset id="contents">
			<legend>#contents</legend>
			<p>
				¿Que tal si leemos <a href="https://wikipedia.org">Wikipedia</a> o
				visitamos <a href="https://w3.org"><i>W3.org</i></a> y aprendemos sobre
				los estándares modernos?
			</p>
		</fieldset>
		<script>
			const contents = document.querySelector('#contents');

			contents.addEventListener('click', (event) => {
				event.preventDefault();
				let closestLink = event.target.closest('a');
				if (closestLink) {
					if (window.confirm('Do you want to leave the page?')) {
						window.location.replace(closestLink.href);
					}
				}
			});
		</script>
	</body>
</html>
