<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			.selected {
				background: #0f0;
			}

			li {
				cursor: pointer;
			}
		</style>
	</head>

	<body>
		Haz click en un elemento de la lista para seleccionarlo.
		<br />

		<ul id="ul">
			<li>Christopher Robin</li>
			<li>Winnie-the-Pooh</li>
			<li>Tigger</li>
			<li>Kanga</li>
			<li>Rabbit. Just rabbit.</li>
		</ul>

		<script>
			const list = document.querySelector('#ul');
			//const refs = new Set();

			list.addEventListener('click', (event) => {
				if (event.target.tagName === 'LI') {
					handleControl(event);

					//handleShift(event, refs);
				}
			});
			// event.metaKey : Cmd in mac, win in windows and so on. An 'OS' key basically.
			function handleControl(event) {
				if (!event.ctrlKey && !event.metaKey) {
					[...event.target.closest('ul').children].forEach((el) =>
						el.classList.remove('selected')
					);
					event.target.classList.add('selected');
				} else {
					event.target.classList.add('selected');
				}
			}
