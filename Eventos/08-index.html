<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			.oculto {
				display: none;
			}

			.bruh {
				width: fit-content;
			}
		</style>
	</head>
	<body>
		<ul class="tree" id="tree">
			<li>
				Animals
				<ul>
					<li>
						Mammals
						<ul>
							<li>Cows</li>
							<li>Donkeys</li>
							<li>Dogs</li>
							<li>Tigers</li>
						</ul>
					</li>
					<li>
						Other
						<ul>
							<li>Snakes</li>
							<li>Birds</li>
							<li>Lizards</li>
						</ul>
					</li>
				</ul>
			</li>
			<li>
				Fishes
				<ul>
					<li>
						Aquarium
						<ul>
							<li>Guppy</li>
							<li>Angelfish</li>
						</ul>
					</li>
					<li>
						Sea
						<ul>
							<li>Sea trout</li>
						</ul>
					</li>
				</ul>
			</li>
		</ul>
	</body>
	<script>
		const tree = document.querySelector('#tree');

		const populateTreeWithSpan = (tree) => {
			const populateSpan = (element) => {
				const sp = document.createElement('span');
				sp.textContent = element.childNodes.item(0).nodeValue;
				element.childNodes.item(0).remove();
				sp.classList.add('ocultar');
				element.prepend(sp);

				if (element.querySelector('ul')) {
					populateTreeWithSpan(element.querySelector('ul'));
				}
			};
			[...tree.children].forEach(populateSpan);
		};

		populateTreeWithSpan(tree);

		tree.addEventListener('click', (event) => {
			console.log(event.target.tagName);
			if (
				event.target.tagName === 'SPAN' &&
				event.target.closest('li').querySelector('ul')
			) {
				event.target
					.closest('li')
					.querySelector('ul')
					.classList.toggle('oculto');
			}
		});
	</script>
</html>
