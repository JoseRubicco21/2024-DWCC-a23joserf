<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="main.css" />

		<script
			defer
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
			integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
			crossorigin="anonymous"
		></script>
		<script
			src="https://kit.fontawesome.com/a7fd78ffdf.js"
			crossorigin="anonymous"
		></script>
		<script src="./main.js" defer></script>
		<title>Lista de la compra</title>
	</head>
	<body>
		<div class="container my-5 col-xl-6 col-lg-6 col-md-8 col-sm-8">
			<div class="vstack gap-3">
				<div class="p-2">
					<img
						class="img-fluid d-inline"
						src="./assets/Todo-for-web.svg"
						alt="Todo icon"
					/>
					<h1 class="p-1 d-inline align-bottom">Lista de la compra</h1>
				</div>
				<div>
					<input
						class="form-control"
						name="add-item-input"
						id="add-item-input"
						type="text"
						placeholder="Introduce un elemento"
					/>
				</div>
				<div>
					<button
						class="btn btn-dark"
						id="add-item-button"
						state="adding"
						disabled
					>
						<i class="fa-solid fa-plus me-1"></i><span>Engadir elemeto</span>
					</button>
				</div>
				<div id="items-container">
					<input
						type="text"
						class="form-control custom-form"
						name="filter-item"
						placeholder="Filtrar items"
						id="filter-item"
					/>
					<div
						class="my-2 row row-cols-2 justify-content-around"
						id="item-list"
					></div>
				</div>
				<button
					class="btn btn-dark p-2 bg-transparent text-secondary border-dark-subtle"
					type="button"
					id="delete-all-button"
				>
					Borrar todo
				</button>
			</div>
		</div>
	</body>
</html>
